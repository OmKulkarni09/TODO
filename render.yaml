# Declarative Render config — used by the "Blueprint" deploy flow at
# https://render.com/blueprints. Lets Render bootstrap the backend service
# automatically when you point it at this repo.
#
# After Render finishes the first deploy, copy the public URL it gives you
# (e.g. https://venom-todo-api.onrender.com) and set it as
# VITE_API_BASE on your Vercel project — then add the Vercel URL back here
# as CORS_ORIGINS via Render's dashboard.
services:
  - type: web
    name: venom-todo-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # SECRET_KEY is auto-generated by Render — sync:false means it's not
      # pulled from anywhere, and `generateValue: true` makes Render create
      # a random one at first deploy. NEVER commit a real secret.
      - key: SECRET_KEY
        generateValue: true
      # CORS_ORIGINS: leave blank for "*" while testing; tighten to your
      # Vercel URL once you have it.
      - key: CORS_ORIGINS
        sync: false
